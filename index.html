<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 3 - Custom Event Bus</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
        background: #f5f5f5;
      }

      #canvas {
        width: 700px;
        height: 400px;
        border: 2px solid #ccc;

        background: #fff;
        margin-bottom: 1rem;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #4caf50;
        color: white;
        cursor: pointer;
      }
    </style>

  <body>
    <div id="canvas"></div>
    <button id="addShapeBtn">Add Shape</button>

    <script type="module" src="/src/main.js"></script>
