<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Node Editor</title>

  <style>
    body {
      margin: 0;
      display: flex;
      font-family: sans-serif;
    }

    #canvas {
      width: 70%;
      height: 100vh;
      border-right: 2px solid #ccc;
    }

    #sidebar {
      width: 30%;
      padding: 15px;
      background: #f5f5f5;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }

    #details {
      margin-top: 10px;
      font-size: 14px;
    }

    .active {
      background: #007bff;
      color: white;
    }
  </style>
</head>

<body>

<div id="canvas"></div>

<div id="sidebar">
  <h3>Node Editor</h3>

  <input id="nodeId" placeholder="Enter node id"/>

  <button id="addBtn">Add Node</button>
  <button id="connectBtn">Connect Mode</button>
  <button id="fitBtn">Fit View</button>

  <div id="status">Nodes: 0 | Connections: 0</div>

  <h4>Inspector</h4>
  <div id="details">Click a node</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
